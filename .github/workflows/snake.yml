# Every morning: redraws the contribution snake and the "by the numbers" card,
# then publishes both to the `output` branch that the README points at.
name: Contribution snake

on:
  schedule:
    - cron: "17 0 * * *"   # once a day, 05:47 IST
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Keep yesterday's card in case today's API call fails
        run: git fetch --depth 1 origin output && git worktree add prev FETCH_HEAD || mkdir -p prev

      # Runs before the snake: the snake step runs in a container as root,
      # so anything that needs to write into dist/ afterwards would be blocked.
      - name: Draw the numbers card
        run: python3 scripts/notes_card.py dist prev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Draw the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2F6F73&color_dots=#dfe5ea,#b9d4d2,#86b5b2,#4f8f8c,#2F6F73
            dist/snake-dark.svg?color_snake=#E8B14A&color_dots=#232d38,#2f4d52,#3e6e6d,#5a9896,#6FB3B1

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
